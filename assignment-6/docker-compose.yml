services:
  prom-graf-app:
    build: .
    container_name: prom-graf-app
    ports:
      - "5055:5055"
    restart: always


  grafana:
    image: grafana/grafana
    container_name: "Grafana"
    ports:
     - 3000:3000
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana

  
  prometheus:
    image: prom/prometheus
    container_name: "prometheus"
    ports:
      - 9090:9090
    restart: always
    volumes:
      - prom_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  grafana_data:
  prom_data:

networks:
  default:
    name: prom-graf-app